# Sao chép file này thành application.properties rồi điền thông tin MySQL của bạn.
# application.properties đã nằm trong .gitignore, KHÔNG commit.

spring.application.name=bluemoon-apartment-management
server.port=8080

spring.datasource.url=jdbc:mysql://localhost:3306/bluemoon?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh&characterEncoding=UTF-8
spring.datasource.username=bluemoon
spring.datasource.password=change_me

# Schema do database/schema.sql quản lý, Hibernate chỉ kiểm tra khớp
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
